name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# Workflow-level so matrix legs never share a group and cancel each other. Each main run gets its own group,
# because a group holds one pending run and a newer one would replace it even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  type-check:
    # Static type checking (issue #20). The dev extra installs mypy; the config
    # lives in pyproject.toml under [tool.mypy]. The matrix matches the other
    # jobs: 3.11 is not in the project's supported set. Runtime dependencies stay stdlib-only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m mypy src
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build test image (Python ${{ matrix.python-version }})
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python-version }} --file Dockerfile.ci --tag promptmigrate-ci:${{ matrix.python-version }} .
      - name: Run complete suite in container
        run: docker run --rm promptmigrate-ci:${{ matrix.python-version }}
  native-test:
    # Docker only covers Linux; the store has Windows-only paths (named mutex, junctions, UNC URIs, reserved names)
    # and macOS has a case-insensitive filesystem, so both run natively.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v
  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install build
      - name: Build and smoke test fresh distributions
        run: |
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf "$artifact_dir"' EXIT
          python -m build --outdir "$artifact_dir"
          python scripts/package_smoke.py "$artifact_dir"/*.whl "$artifact_dir"/*.tar.gz
