[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptmigrate"
version = "0.1.0"
description = "Alembic-inspired migration control for production AI prompts and agent configurations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PromptMigrate contributors" }]
keywords = ["llm", "prompt", "migration", "version-control", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Version Control",
]

[project.scripts]
promptmigrate = "promptmigrate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Static type checking (issue #20). Start in lenient mode: check the annotated
# code under src/ without demanding full annotation coverage. Runtime stays
# stdlib-only; mypy is a dev-only tool. No python_version is pinned here, so the
# checker follows whatever interpreter CI / the developer runs (3.10-3.13).
[tool.mypy]
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
warn_unused_configs = false
